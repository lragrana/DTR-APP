server_tokens off;

# Plain HTTP only redirects to HTTPS.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /tmp/tls/cert.pem;
    ssl_certificate_key /tmp/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    client_max_body_size 16k;
    root /usr/share/nginx/html;

    # Hashed build files can be cached; the HTML page is always re-validated.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their IP for rate limiting / audit logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }
}
